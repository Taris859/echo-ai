services:
  - type: web
    name: echo-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: NVIDIA_CHAT_KEY
        sync: false
      - key: NVIDIA_EMBED_KEY
        sync: false
      - key: CHAT_ENCRYPTION_KEY
        generateValue: true
