name: Deploy Flutter Web to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Flutter Framework
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: 3. Install Dependencies
        run: flutter pub get

      - name: 4. Build Flutter Web App for GitHub Pages
        run: |
          flutter build web --base-href "/echo-ai/"
          cp build/web/index.html build/web/404.html

      - name: 5. Deploy to GitHub Pages Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
